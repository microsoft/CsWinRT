    
steps:
# Enable GC stress
  - task: PowerShell@2
    displayName: Enable GC Stress
    condition: and(succeeded(), eq(variables['_RunGCStress'], 'true'))
    inputs:
      targetType: inline
      script: |
        Write-Host "##vso[task.setvariable variable=DOTNET_GCStress;]0xC"

# Run Unit Tests
  - task: DotNetCoreCLI@2
    displayName: Run Unit Tests
    condition: and(succeeded(), or(eq(variables['BuildPlatform'], 'x86'), eq(variables['BuildPlatform'], 'x64')))
    continueOnError: True
    inputs:
      command: test
      projects: 'src/Tests/UnitTest/UnitTest.csproj'
      arguments: >
        /p:platform=$(BuildPlatform);configuration=$(BuildConfiguration)
        --no-build
      testRunTitle: Unit Tests

# Run Source Generator 2 Tests. Gated to x64 only: these are Roslyn analyzer/source-generator tests,
# which are architecture-independent (the compiler runs the analyzer the same regardless of the target
# platform), so running them x86 adds no coverage. The x86 (32-bit) test host loads the full .NET 10
# reference pack plus WinUI/CsWinRT references across 100+ cases and exhausts the ~2-4 GB address space
# on memory-constrained pools (e.g. the OneBranch managed pool), throwing OutOfMemoryException.
  - task: DotNetCoreCLI@2
    displayName: Run Source Generator 2 Tests
    condition: and(succeeded(), eq(variables['BuildPlatform'], 'x64'))
    inputs:
      command: test
      projects: 'src/Tests/SourceGenerator2Test/SourceGenerator2Test.csproj'
      arguments: >
        /p:platform=$(BuildPlatform);configuration=$(BuildConfiguration)
        --no-build
      testRunTitle: Source Generator 2 Tests

# Run WinMD Generator Tests. Gated to x64 only for the same reason as the source generator tests: these
# run the 'cswinrtwinmdgen' tool end-to-end as a separate process (which is always built for the build
# host), so the target platform makes no difference to what they cover.
  - task: DotNetCoreCLI@2
    displayName: Run WinMD Generator Tests
    condition: and(succeeded(), eq(variables['BuildPlatform'], 'x64'))
    inputs:
      command: test
      projects: 'src/Tests/WinMDGeneratorTest/WinMDGeneratorTest.csproj'
      arguments: >
        /p:platform=$(BuildPlatform);configuration=$(BuildConfiguration)
        --no-build
      testRunTitle: WinMD Generator Tests

# Run Projection Writer Tests. Gated to x64 only: these drive the projection writer through the
# 'cswinrtprojectionrefgen' tool as a separate process, so the target platform adds no coverage.
  - task: DotNetCoreCLI@2
    displayName: Run Projection Writer Tests
    condition: and(succeeded(), eq(variables['BuildPlatform'], 'x64'))
    inputs:
      command: test
      projects: 'src/Tests/ProjectionWriterTest/ProjectionWriterTest.csproj'
      arguments: >
        /p:platform=$(BuildPlatform);configuration=$(BuildConfiguration)
        --no-build
      testRunTitle: Projection Writer Tests

# Run Impl Generator Tests. Gated to x64 only for the same reason as the other generator tests: these
# run the 'cswinrtimplgen' tool end-to-end as a separate process (which is always built for the build
# host), so the target platform makes no difference to what they cover.
  - task: DotNetCoreCLI@2
    displayName: Run Impl Generator Tests
    condition: and(succeeded(), eq(variables['BuildPlatform'], 'x64'))
    inputs:
      command: test
      projects: 'src/Tests/ImplGeneratorTest/ImplGeneratorTest.csproj'
      arguments: >
        /p:platform=$(BuildPlatform);configuration=$(BuildConfiguration)
        --no-build
      testRunTitle: Impl Generator Tests

# Run Host Tests
  - task: CmdLine@2
    displayName: Run Host Tests
    enabled: false
    condition: and(succeeded(), or(eq(variables['BuildPlatform'], 'x86'), eq(variables['BuildPlatform'], 'x64')))
    continueOnError: True
    inputs:
      workingDirectory: $(Build.SourcesDirectory)\src
      script: |
        dir _build\$(BuildPlatform)\$(BuildConfiguration)\HostTest\bin
        _build\$(BuildPlatform)\$(BuildConfiguration)\HostTest\bin\HostTest.exe --gtest_output=xml:HOSTTEST-$(Build.BuildNumber).xml 

# Run BuildDeterminism Tests. TODO: Disabled for now until BuildDeterminismTest.exe transient failures can be solved.
  # - task: CmdLine@2
  #   displayName: Run BuildDeterminism Tests
  #   enabled: false
  #   condition: and(succeeded(), or(eq(variables['BuildPlatform'], 'x86'), eq(variables['BuildPlatform'], 'x64')))
  #   continueOnError: True
  #   inputs:
  #     workingDirectory: $(Build.SourcesDirectory)\src
  #     script: |
  #       dir Tests\BuildDeterminismTest\bin\$(BuildPlatform)\$(BuildConfiguration)\net10.0
  #       Tests\BuildDeterminismTest\bin\$(BuildPlatform)\$(BuildConfiguration)\net10.0\BuildDeterminismTest.exe -p:CIBuildReason=CI,VersionNumber=$(VersionNumber),VersionString=$(Build.BuildNumber),AssemblyVersionNumber=$(WinRT.Runtime.AssemblyVersion),GenerateTestProjection=true,PublishBuildTool=true,BuildToolArch=$(CsWinRTBuildToolsArch)

# Run Authoring Consumption Tests  
  - task: CmdLine@2
    displayName: Run Authoring Consumption Tests
    enabled: true
    condition: and(succeeded(), or(eq(variables['BuildPlatform'], 'x86'), eq(variables['BuildPlatform'], 'x64')))
    continueOnError: True
    inputs:
      workingDirectory: $(Build.SourcesDirectory)\src
      script: |
        dir _build\$(BuildPlatform)\$(BuildConfiguration)\AuthoringConsumptionTest\bin
        _build\$(BuildPlatform)\$(BuildConfiguration)\AuthoringConsumptionTest\bin\AuthoringConsumptionTest.exe --gtest_output=xml:AUTHORINGTEST-$(Build.BuildNumber).xml 

# Run Multi-Component Authoring Consumption Tests
  - task: CmdLine@2
    displayName: Run Multi-Component Authoring Consumption Tests
    enabled: true
    condition: and(succeeded(), or(eq(variables['BuildPlatform'], 'x86'), eq(variables['BuildPlatform'], 'x64')))
    continueOnError: True
    inputs:
      workingDirectory: $(Build.SourcesDirectory)\src
      script: |
        dir _build\$(BuildPlatform)\$(BuildConfiguration)\AuthoringConsumptionTest2\bin
        _build\$(BuildPlatform)\$(BuildConfiguration)\AuthoringConsumptionTest2\bin\AuthoringConsumptionTest2.exe --gtest_output=xml:AUTHORINGTEST2-$(Build.BuildNumber).xml 

# Run WUX Tests
  - task: CmdLine@2
    displayName: Run WUX Tests
    enabled: true
    condition: and(succeeded(), or(eq(variables['BuildPlatform'], 'x86'), eq(variables['BuildPlatform'], 'x64')))
    continueOnError: True
    inputs:
      workingDirectory: $(Build.SourcesDirectory)\src
      script: |
        dir _build\$(BuildPlatform)\$(BuildConfiguration)\AuthoringWuxConsumptionTest\bin
        _build\$(BuildPlatform)\$(BuildConfiguration)\AuthoringWuxConsumptionTest\bin\AuthoringWuxConsumptionTest.exe --gtest_output=xml:AUTHORINGWUXTEST-$(Build.BuildNumber).xml 

  - task: MSBuild@1
    displayName: Restore cswinrt.slnx 
    condition: and(succeeded(), and(eq(variables['BuildConfiguration'], 'release'), eq(variables['BuildPlatform'], 'x64')))
    inputs:
      solution: $(Build.SourcesDirectory)\src\cswinrt.slnx
      msbuildArguments: /t:restore /p:RuntimeIdentifier=win-$(BuildPlatform),RestorePackagesConfig=true,TargetFramework=net10.0,solutiondir=$(Build.SourcesDirectory)\src\,GenerateTestProjection=true
      platform: $(BuildPlatform)
      configuration: $(BuildConfiguration)
  
  - task: MSBuild@1
    displayName: Restore WinRT.Generator.Tasks.csproj
    condition: and(succeeded(), and(eq(variables['BuildConfiguration'], 'release'), eq(variables['BuildPlatform'], 'x64')))
    inputs:
      solution: $(Build.SourcesDirectory)\src\WinRT.Generator.Tasks\WinRT.Generator.Tasks.csproj
      msbuildArguments: /t:restore /p:RuntimeIdentifier=win-$(BuildPlatform),TargetFramework=netstandard2.0,solutiondir=$(Build.SourcesDirectory)\src\,GenerateTestProjection=true
      platform: $(BuildPlatform)
      configuration: $(BuildConfiguration)
  
  - task: MSBuild@1
    displayName: Publish UnitTests for AOT (net10.0)
    condition: and(succeeded(), and(eq(variables['BuildConfiguration'], 'release'), eq(variables['BuildPlatform'], 'x64')))
    inputs:
      solution: $(Build.SourcesDirectory)\src\Tests\UnitTest\UnitTest.csproj
      msbuildArguments: /t:publish /p:RuntimeIdentifier=win-$(BuildPlatform),TargetFramework=net10.0,solutiondir=$(Build.SourcesDirectory)\src\,GenerateTestProjection=true,BuildToolArch=$(CsWinRTBuildToolsArch),VersionNumber=$(VersionNumber),VersionString=$(Build.BuildNumber),AssemblyVersionNumber=$(WinRT.Runtime.AssemblyVersion),AllowedReferenceRelatedFileExtensions=".xml;.pri;.dll.config;.exe.config"
      platform: $(BuildPlatform)
      configuration: $(BuildConfiguration)

  - task: CmdLine@2
    displayName: Run UnitTest for AOT (net10.0)
    continueOnError: True
    condition: and(succeeded(), and(eq(variables['BuildConfiguration'], 'release'), eq(variables['BuildPlatform'], 'x64')))
    inputs:
      workingDirectory: $(Build.SourcesDirectory)\src\Tests\UnitTest\bin\$(BuildPlatform)\$(BuildConfiguration)\net10.0\win-$(BuildPlatform)\publish
      script: |
        dir
        echo Running UnitTest.exe 
        UnitTest.exe --report-trx --report-trx-filename UNITTEST-AOT-$(Build.BuildNumber).trx
        if %Errorlevel% NEQ 100 (
          exit /b !ErrorLevel!
        )
        exit /b 0 

  - task: PublishTestResults@2
    displayName: Publish UnitTest AOT (net10.0) Results
    condition: and(always(), and(eq(variables['BuildConfiguration'], 'release'), eq(variables['BuildPlatform'], 'x64')))
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/UNITTEST-AOT-$(Build.BuildNumber).trx'
      searchFolder: $(Build.SourcesDirectory)\src\Tests\UnitTest\bin\$(BuildPlatform)\$(BuildConfiguration)\net10.0\win-$(BuildPlatform)\publish\TestResults
      testRunTitle: Unit Tests AOT (net10.0)

# Run Functional Tests
  - template: CsWinRT-FunctionalTest-Steps.yml@self

# Disable GC stress
  - task: PowerShell@2
    displayName: Disable GC Stress
    condition: and(succeeded(), eq(variables['_RunGCStress'], 'true'))
    inputs:
      targetType: inline
      script: |
        Write-Host "##vso[task.setvariable variable=DOTNET_GCStress;]0x0"

# Fail the pipeline if any test steps failed
  - task: PowerShell@2
    displayName: Fail if any tests failed
    condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')
    inputs:
      targetType: inline
      script: |
        Write-Host "##vso[task.logissue type=error]One or more test steps failed. See above for details."
        exit 1
