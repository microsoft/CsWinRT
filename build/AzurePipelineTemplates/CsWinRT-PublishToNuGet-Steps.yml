parameters:
- name: 'IsGitHub'
  displayName: 'GitHub Build'
  type: boolean
  default: false

steps:    
  - task: NuGetAuthenticate@1

  # Download x86 
  - task: DownloadPipelineArtifact@2
    displayName: 'Download x86 '
    inputs:
      artifactName: drop_BuildAndTest_release_x86
      itemPattern: ''
      targetPath: $(Build.SourcesDirectory)\release_x86

  # Download x64
  - task: DownloadPipelineArtifact@2
    displayName: Download x64
    inputs:
      artifactName: drop_BuildAndTest_release_x64
      itemPattern: ''
      targetPath: $(Build.SourcesDirectory)\release_x64

  # Download arm64 
  - task: DownloadPipelineArtifact@2
    displayName: Download arm64
    inputs:
      artifactName: drop_BuildAndTest_release_arm64
      itemPattern: ''
      targetPath: $(Build.SourcesDirectory)\release_arm64

  # Parse Versions
  - task: CmdLine@2
    displayName: Parse Versions
    inputs:
      workingDirectory: $(Build.SourcesDirectory)
      script: |
        rem Parse the build-generated Build.BuildNumber into components that 
        rem can be recombined for version resources, nuget packages, etc.

        @echo off

        rem Encode the build date/rev into a 16 bit value for resource versions
        if "$(PrereleaseVersion)"=="" (
          set RevisionBase=30000
        ) else (
          set RevisionBase=0
        )
        for /f "tokens=4,5 delims=." %%i in ("$(Build.BuildNumber)") do set BuildMetadata=%%i.%%j & set /a BuildRevision=%RevisionBase%+(((%%i/10000)-20)*366+((%%i)%%10000)/100*31+((%%i)%%100))*10+%%j

        set VersionNumber=$(MajorVersion).$(MinorVersion).$(PatchVersion).%BuildRevision%

        if "$(PrereleaseVersion)"=="" (
          set NugetVersion=$(MajorVersion).$(MinorVersion).$(PatchVersion)
        ) else (
          set NugetVersion=$(Build.BuildNumber)
        )

        rem Export generated version numbers back for subsequent tasks
        echo ##vso[task.setvariable variable=BuildMetadata;]%BuildMetadata%
        echo ##vso[task.setvariable variable=BuildRevision;]%BuildRevision%
        echo ##vso[task.setvariable variable=VersionNumber;]%VersionNumber%
        echo ##vso[task.setvariable variable=NugetVersion;]%NugetVersion%

  # Conditionally add SDK projection entries to nuspec when generating
  - task: PowerShell@2
    displayName: Add SDK projection entries to nuspec
    condition: eq(variables['_GenerateSdkProjection'], 'true')
    inputs:
      targetType: inline
      script: |
        $nuspecPath = "$(Build.SourcesDirectory)\nuget\Microsoft.Windows.CsWinRT.nuspec"
        $implEntries = @"
            <file src="$(Build.SourcesDirectory)\release_x86\impl\17763\WinRT.Sdk.Projection.dll" target="impl\net10\17763\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\17763\WinRT.Sdk.Xaml.Projection.dll" target="impl\net10\17763\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\18362\WinRT.Sdk.Projection.dll" target="impl\net10\18362\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\18362\WinRT.Sdk.Xaml.Projection.dll" target="impl\net10\18362\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\19041\WinRT.Sdk.Projection.dll" target="impl\net10\19041\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\19041\WinRT.Sdk.Xaml.Projection.dll" target="impl\net10\19041\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\22000\WinRT.Sdk.Projection.dll" target="impl\net10\22000\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\22000\WinRT.Sdk.Xaml.Projection.dll" target="impl\net10\22000\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\22621\WinRT.Sdk.Projection.dll" target="impl\net10\22621\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\22621\WinRT.Sdk.Xaml.Projection.dll" target="impl\net10\22621\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\26100\WinRT.Sdk.Projection.dll" target="impl\net10\26100\"/>
            <file src="$(Build.SourcesDirectory)\release_x86\impl\26100\WinRT.Sdk.Xaml.Projection.dll" target="impl\net10\26100\"/>
        "@
        (Get-Content $nuspecPath -Raw).Replace('  </files>', "$implEntries`n  </files>") | Set-Content $nuspecPath

  # NuGet Pack
  - task: NuGetCommand@2
    displayName: NuGet pack
    inputs:
      command: pack
      searchPatternPack: nuget/Microsoft.Windows.CsWinRT.nuspec
      configurationToPack: Release
      buildProperties: "\
        cswinrt_nuget_version=$(NugetVersion);\
        interop_winmd=$(Build.SourcesDirectory)\\release_x86\\native\\WindowsRuntime.Internal.winmd;\
        net10_runtime=$(Build.SourcesDirectory)\\release_x86\\net10.0\\WinRT.Runtime.dll;\
        net10_runtime_ref=$(Build.SourcesDirectory)\\release_x86\\net10.0\\ref\\WinRT.Runtime.dll;\
        net10_runtime_ref_xml=$(Build.SourcesDirectory)\\release_x86\\net10.0\\ref\\WinRT.Runtime.xml;\
        source_generator=$(Build.SourcesDirectory)\\release_x86\\net10.0\\WinRT.SourceGenerator.dll;\
        winrt_shim=$(Build.SourcesDirectory)\\release_x86\\net10.0\\WinRT.Host.Shim.dll;\
        winrt_host_x86=$(Build.SourcesDirectory)\\release_x86\\native\\WinRT.Host.dll;\
        winrt_host_x64=$(Build.SourcesDirectory)\\release_x64\\native\\WinRT.Host.dll;\
        winrt_host_arm64=$(Build.SourcesDirectory)\\release_arm64\\native\\WinRT.Host.dll;\
        winrt_host_resource_x86=$(Build.SourcesDirectory)\\release_x86\\native\\WinRT.Host.dll.mui;\
        winrt_host_resource_x64=$(Build.SourcesDirectory)\\release_x64\\native\\WinRT.Host.dll.mui;\
        winrt_host_resource_arm64=$(Build.SourcesDirectory)\\release_arm64\\native\\WinRT.Host.dll.mui;\
        cswinrtinteropgen_x64=$(Build.SourcesDirectory)\\release_x64\\net10.0\\native\\cswinrtinteropgen.exe;\
        cswinrtinteropgen_arm64=$(Build.SourcesDirectory)\\release_arm64\\net10.0\\native\\cswinrtinteropgen.exe;\
        cswinrtimplgen_x64=$(Build.SourcesDirectory)\\release_x64\\net10.0\\native\\cswinrtimplgen.exe;\
        cswinrtimplgen_arm64=$(Build.SourcesDirectory)\\release_arm64\\net10.0\\native\\cswinrtimplgen.exe;\
        cswinrtprojectiongen_x64=$(Build.SourcesDirectory)\\release_x64\\net10.0\\native\\cswinrtprojectiongen.exe;\
        cswinrtprojectiongen_arm64=$(Build.SourcesDirectory)\\release_arm64\\net10.0\\native\\cswinrtprojectiongen.exe;\
        cswinrtprojectionrefgen_x64=$(Build.SourcesDirectory)\\release_x64\\net10.0\\native\\cswinrtprojectionrefgen.exe;\
        cswinrtprojectionrefgen_arm64=$(Build.SourcesDirectory)\\release_arm64\\net10.0\\native\\cswinrtprojectionrefgen.exe;\
        cswinrtwinmdgen_x64=$(Build.SourcesDirectory)\\release_x64\\net10.0\\native\\cswinrtwinmdgen.exe;\
        cswinrtwinmdgen_arm64=$(Build.SourcesDirectory)\\release_arm64\\net10.0\\native\\cswinrtwinmdgen.exe;\
        run_cswinrt_generator_task=$(Build.SourcesDirectory)\\release_x86\\netstandard2.0\\WinRT.Generator.Tasks.dll;\
        branch=$(Build.SourceBranchName);\
        commit=$(Build.SourceVersion)"
      packDestination: $(ob_outputDirectory)\packages

  # Build and run the end-to-end smoke tests against the freshly packed NuGet package. These
  # verify that the real package (ref/lib assemblies, generators, and build targets) works for
  # a consuming app, a component author, a projection author, and the Windows SDK projection packages,
  # fully isolated from the repo build infrastructure. The smoke tests restore the package being tested
  # from the packed output above, and all other dependencies (notably the preview Windows SDK ref pack
  # and 'Microsoft.Windows.SDK.Contracts') from the CsWinRTDependencies feed.
  #
  # Each smoke test runs as its own step with 'continueOnError' (so a failure only marks the job
  # as 'SucceededWithIssues' and makes it obvious which one failed); a final gate step below turns
  # any such issue into an actual failure. This mirrors the unit test steps in CsWinRT-Test-Steps.yml.
  # The consumption and authoring tests each run twice: once on CoreCLR and once with Native AOT, so a
  # failure points at the exact runtime. The projection, Windows SDK projection, and Windows SDK XAML
  # projection tests are build-only, so they run once on CoreCLR. Native AOT publishes are x64 (this job
  # only runs on an x64 host).
  - task: UseDotNet@2
    displayName: Use .NET SDK for smoke tests
    inputs:
      packageType: sdk
      version: $(_DotnetVersion)

  - task: PowerShell@2
    displayName: Run Consumption smoke test (CoreCLR)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test Consumption -Runtime CoreCLR
      workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Run Consumption smoke test (NAOT)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test Consumption -Runtime NativeAot
      workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Run Authoring smoke test (CoreCLR)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test Authoring -Runtime CoreCLR
      workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Run Authoring smoke test (NAOT)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test Authoring -Runtime NativeAot
      workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Run Projection smoke test (CoreCLR)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test Projection -Runtime CoreCLR
      workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Run Windows SDK projection smoke test (CoreCLR)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test WindowsSdkProjection -Runtime CoreCLR
      workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Run Windows SDK XAML projection smoke test (CoreCLR)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test WindowsSdkXamlProjection -Runtime CoreCLR
      workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Run component using a packaged projection smoke test (CoreCLR)
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)\src\Tests\SmokeTests\run-smoke-tests.ps1
      arguments: -PackageSource "$(ob_outputDirectory)\packages" -PackageVersion "$(NugetVersion)" -Test ComponentUsingProjection -Runtime CoreCLR
      workingDirectory: $(Build.SourcesDirectory)

  # Fail the job if any smoke test above failed. Each smoke test uses 'continueOnError', so an
  # individual failure only marks the job as 'SucceededWithIssues'; this turns that into a real
  # failure, while still letting every smoke test run and report first.
  - task: PowerShell@2
    displayName: Fail if any smoke test failed
    condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')
    inputs:
      targetType: inline
      script: |
        Write-Host "##vso[task.logissue type=error]One or more smoke tests failed. See above for details."
        exit 1

  - ${{ if eq(parameters.IsGitHub, false) }}:

  # NuGet signing
    - task: onebranch.pipeline.signing@1
      displayName: '🔒 Onebranch Signing for NuGet'
      inputs:
        command: sign
        cp_code: 'CP-401405'
        files_to_sign: Microsoft.Windows.CsWinRT.*.nupkg
        search_root: $(ob_outputDirectory)\packages
